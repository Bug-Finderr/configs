# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json

# Configuration generated by YASB Setup Wizard.
# For more information, visit https://github.com/amnweb/yasb/wiki
watch_stylesheet: true
watch_config: true
debug: false
update_check: true
bars:
  primary-bar:
    enabled: true
    screens:
    - '*'
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      enabled: false
      round_corners: true
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 36
    padding:
      top: 4
      left: 0
      bottom: 4
      right: 0
    widgets:
      left:
      - power_menu
      - windows_desktop
      - active_window
      center:
      - clock
      right:
      - cava
      - systray
      - system_status
widgets:
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%a, %d %b %H:%M}<span>{alarm}</span>'
      label_alt: '{%a, %d %b %H:%M}'
      timezones: []
      calendar:
        blur: false
        round_corners: true
        alignment: center
        direction: down
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span> {level}"
      tooltip: true
      scroll_step: 2
      mute_text: "Muted"
      icons:
        muted: "\ueee8"
        "10": "\uf026"
        "30": "\uf027"
        "60": "\uf027"
        "100": "\uf028"
      audio_menu:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_apps: false
      callbacks:
        on_left: "toggle_volume_menu"
        on_middle: "toggle_mute"
        on_right: 'exec pwsh.exe -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File D:\Files\Dev\configs\windows\yasb\cycle-audio-output.ps1'
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: "<span>\udb80\udc09</span>"
      uptime: true
      show_user: true
      menu_style: popup
      popup:
        blur: false
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: left
        offset_left: 0
      profile_image_size: 64
      buttons:
        lock:
        - "\uDB80\uDF41"
        - Lock
        signout:
        - "\uDB80\uDF43"
        - Sign out
        sleep:
        - "\uDB82\uDD04"
        - Sleep
        hibernate:
        - "\uDB82\uDD01"
        - Hibernate
        restart:
        - "\uDB81\uDC53"
        - Restart
        shutdown:
        - "\uDB82\uDD06"
        - Shut Down
        cancel:
        - ''
        - Cancel
  active_window:
    type: yasb.active_window.ActiveWindowWidget
    options:
      label: '{win[title]}'
      label_alt: '{win[title]}'
      label_no_window: ''
      label_icon: true
      label_icon_size: 16
      max_length: 32
      max_length_ellipsis: '...'
      monitor_exclusive: false
  taskbar_toggle:
    type: "yasb.custom.CustomWidget"
    options:
      label: "<span>\uf2d0</span>"
      label_alt: "<span>\uf2d0</span>"
      label_placeholder: ""
      class_name: "taskbar-toggle"
      tooltip: false
      exec_options:
        run_once: true
      callbacks:
        on_left: 'exec cmd.exe /c C:\PROGRA~1\thide\bin\thide.exe toggle'
        on_middle: 'exec cmd.exe /c C:\PROGRA~1\thide\bin\thide.exe show'
        on_right: 'exec cmd.exe /c C:\PROGRA~1\thide\bin\thide.exe hide'
  windows_desktop:
    type: "yasb.windows_desktops.WorkspaceWidget"
    options:
      label_workspace_btn: ""
      label_workspace_active_btn: ""
      callbacks:
        on_left: "activate_workspace"
        on_middle: "move_window_here"
        on_right: "toggle_context_menu"
  cava:
    type: "yasb.cava.CavaWidget"
    options:
      bar_height: 12
      waveform: 0
      waves: 0
      monstercat: 0
      sensitivity: 100
      edge_fade: 1
      min_bar_height: 0
      gradient: 0
      foreground: "#C9CEDA"
      bars_number: 14
      bar_spacing: 2
      bar_width: 3
      bar_type: "waves"
      framerate: 30
      sleep_timer: 1
      hide_empty: true
      callbacks:
        on_left: "do_nothing"
        on_middle: "do_nothing"
        on_right: "reload_cava"
  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "•••"
      label_expanded: "•••"
      label_position: "left" # Can be "left" or "right"
      icon_size: 16 # Can be any integer between 8 and 64
      pin_click_modifier: "alt" # Can be "ctrl", "alt" or "shift"
      show_unpinned: false
      show_unpinned_button: true
      show_battery: false
      show_in_popup: true
      show_volume: false
      icons_per_row: 5
      show_network: false
      use_hook: true # Use the hook backend so tray icon right-click menus are forwarded.
      hide_icons: [] # Optional, list of process names to hide (e.g. ["discord"])
      popup:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: None
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span>\udb83\udc8d</span>"
    # Example path to folder with images. Can be a single string or a list of strings.
    # image_path: "C:\\Users\\{Username}\\Images"
      image_path:
        - "C:\\Users\\Sudharsan\\Pictures\\Wallpapers"
      change_automatically: false # Automatically change wallpaper
      update_interval: 60 # If change_automatically is true, update interval in seconds
      run_after:
        - 'pwsh.exe -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File D:\Files\Dev\configs\windows\yasb\wallpaper-accent.ps1 -ImagePath {image}'
      engine:
        enabled: true
        animation: "circle" # circle/slide_top/diamond/split
      gallery:
        enabled: true
        blur: false
        image_width: 220
        image_per_page: 6
        gallery_columns: 0 # 0 = auto, matches image_per_page for a single row
        horizontal_position: "center" # left/center/right placement on screen
        vertical_position: "center" # top/center/bottom placement
        position_offset: 0 # minimum gap (px) from screen edges - see below for advanced options
        respect_work_area: true # clamp to OS work area (avoids Windows taskbar)
        show_buttons: false
        orientation: "portrait"
        image_spacing: 8
        lazy_load: true
        lazy_load_fadein: 400
        image_corner_radius: 8
      callbacks:
        on_left: "toggle_gallery"
        on_middle: 'exec pwsh.exe -NoProfile -STA -WindowStyle Hidden -ExecutionPolicy Bypass -File D:\Files\Dev\configs\windows\yasb\theme-panel.ps1'
        on_right: "change_wallpaper"
  system_status:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "system-status"
      widgets:
        - traffic
        - cpu
        - memory
        - wallpapers
        - taskbar_toggle
        - volume
        - battery
      collapse_options:
        enabled: false
  traffic:
    type: "yasb.traffic.TrafficWidget"
    options:
      label: "<span>\ueab4</span>{download_speed} <span>\ueab7</span>{upload_speed}"
      label_alt: "Down {download_speed} | Up {upload_speed}"
      interface: "auto"
      update_interval: 1000
      hide_if_offline: false
      speed_unit: "bytes"
      hide_decimal: false
      speed_threshold:
        min_upload: 0
        min_download: 0
      menu:
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_interface_name: true
        show_internet_info: true
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"
  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uf4bc</span> {info[percent][total]}%"
      label_alt: "<span>\uf437</span> {info[freq][current]} MHz"
      update_interval: 2000
      hide_decimal: true
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"
      menu:
        enabled: true
        blur: false
        round_corners: true
        border_color: "system"
        alignment: "right"
        direction: "down"
        show_graph: true
        show_graph_grid: false
        graph_history_size: 60
  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\uefc5</span> {virtual_mem_percent}%"
      label_alt: "RAM {virtual_mem_used}/{virtual_mem_total}"
      update_interval: 5000
      hide_decimal: true
      callbacks:
        on_left: "toggle_label"
        on_right: "toggle_menu"
      menu:
        enabled: true
        blur: false
        round_corners: true
        border_color: "system"
        alignment: "right"
        direction: "down"
        show_graph: true
        show_graph_grid: false
        graph_history_size: 60
  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span> {percent}%"
      label_alt: "<span>{icon}</span> {percent}%"
      update_interval: 5000
      hide_unsupported: true
      charging_options:
        icon_format: "{charging_icon}"
        blink_charging_icon: false
      status_thresholds:
        critical: 10
        low: 25
        medium: 75
        high: 95
        full: 100
      status_icons:
        icon_charging: "\udb80\udc84"
        icon_critical: "\uf244"
        icon_low: "\uf243"
        icon_medium: "\uf242"
        icon_high: "\uf241"
        icon_full: "\uf240"
      callbacks:
        on_left: "do_nothing"
        on_right: "exec cmd.exe /c start ms-settings:batterysaver"
